[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "Local semantic search for documents exposed through MCP and a CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9,<2",
    "httpx>=0.28,<1",
    "mcp[cli]>=1.30,<2",
    "pypdf>=6.12.2,<7",
    "python-docx>=1.2,<2",
    "sentence-transformers>=5.5.1,<6",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[project.scripts]
knowledge = "knowledge_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

